[package]
name = "truman_fused"
version = "0.1.0"
edition = "2024"
description = "FUSE daemon for TrumanFS - whitelist-based filesystem visibility"

[dependencies]
# FUSE filesystem
# Note: fuser 0.16.0 has macOS build regression, staying on 0.15 for now
fuser = "0.15"

# JSON for Port communication (audit-first logging requires human-readable format)
serde_json = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }

# Base64 encoding for binary data in JSON
base64 = "0.22"

# Error handling
anyhow = "1.0"

# Logging
log = "0.4"
env_logger = "0.11"
